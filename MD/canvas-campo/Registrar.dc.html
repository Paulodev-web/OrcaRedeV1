<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4472b4; text-decoration: none; }
    a:hover { color: #355a92; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #262623; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; overflow: hidden;">

  <!-- planta esmaecida por tras -->
  <div style="position: absolute; inset: 0; opacity: 0.30;">
    <svg viewBox="0 0 390 844" style="width: 100%; height: 100%;">
      <rect width="390" height="844" fill="#f7f6f3"/>
      <path d="M0 300 H390 M194 90 V700" stroke="#ffffff" stroke-width="26"/>
      <circle cx="62" cy="280" r="11" fill="#357d49"/><circle cx="150" cy="280" r="11" fill="#357d49"/>
    </svg>
  </div>

  <div style="position: relative; background: #ffffff; border-radius: 20px 20px 0 0; padding: 10px 16px 26px; display: flex; flex-direction: column; gap: 18px;">
    <div style="width: 40px; height: 4px; border-radius: 9999px; background: #d6d5ce; align-self: center; margin-bottom: 2px;"></div>
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px;">Registrar</div>

    <!-- os tres do dia inteiro -->
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 12px; background: #4472b4; border-radius: 14px; min-height: 108px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff;">Poste</div>
          <div style="font-size: 14px; color: #c9dcf8;">toque no cinza</div>
        </div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 12px; background: #4472b4; border-radius: 14px; min-height: 108px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"><path d="M14.7 6.3a4.5 4.5 0 0 0 5.9 5.9L21 21H3l7.6-8.4a4.5 4.5 0 0 0 4.1-6.3z"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff;">Equipamento</div>
          <div style="font-size: 14px; color: #c9dcf8;">no poste</div>
        </div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 12px; background: #4472b4; border-radius: 14px; min-height: 108px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"><path d="M2 9c3.5-4 6.5-4 10 0s6.5 4 10 0"/><path d="M2 16c3.5-4 6.5-4 10 0s6.5 4 10 0"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff;">Rede</div>
          <div style="font-size: 14px; color: #c9dcf8;">v&atilde;o previsto</div>
        </div>
      </div>
    </div>

    <!-- o raro e urgente, sozinho -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 15px 16px; background: #fef1ef; border: 1.5px solid #fccbc5; border-radius: 14px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ae443d" stroke-width="2.1" stroke-linecap="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
        <div style="font-size: 17px; font-weight: 700; color: #722c27;">Impedimento</div>
        <div style="font-size: 14px; color: #8d352e;">a obra parou</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ae443d" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <!-- ritmo de etapa -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 4px 2px; border-top: 1px solid #e9e8e3;">
      <div style="width: 42px; height: 42px; border-radius: 10px; background: #f5f4f1; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#504f48" stroke-width="2" stroke-linecap="round"><path d="M4 21V4a1 1 0 0 1 1-1h10l-1.5 4L15 11H5"/><path d="M4 21h5"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
        <div style="font-size: 17px; font-weight: 600; color: #262623;">Marco</div>
        <div style="font-size: 14px; color: #767469;">concluir etapa com evid&ecirc;ncia</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa9a2" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>

<body>
<x-dc>
<helmet>

<div style="width: 390px; height: 844px; background: #fafaf8; color: #262623; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

      <div style="font-size: 14px; color: #767469;">Jos&eacute; Carlos &middot; gerente</div>
    </div>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#504f48" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <!-- fila pendente: so aparece quando ha o que decidir -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 15px; background: #f5e8dd; border: 1px solid #ecd4bf; border-radius: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#764b1b" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <div style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #5f3d18;">3 registros esperando sinal</div>
      <span style="font-size: 14px; font-weight: 600; color: #764b1b;">Ver</span>
    </div>

    <div style="padding: 16px; background: #ffffff; border: 1px solid #e9e8e3; border-radius: 14px; display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 19px; font-weight: 600; line-height: 24px; letter-spacing: -0.2px;">Loteamento Sol Poente</div>
          <div style="font-size: 14px; color: #767469;">Const. Vale Verde &middot; Chapec&oacute;</div>
        </div>
        <div style="padding: 6px 11px; background: #dfeeee; border-radius: 9999px; font-size: 14px; font-weight: 600; color: #1a6162; white-space: nowrap;">Em obra</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 14px; color: #767469;">12 de 32 postes</span>
          <span style="font-size: 14px; font-weight: 700; color: #504f48; font-variant-numeric: tabular-nums;">38%</span>
        </div>
        <div style="height: 8px; border-radius: 9999px; background: #e9e8e3; overflow: hidden;">
          <div style="width: 38%; height: 8px; border-radius: 9999px; background: #357d49;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-top: 2px;">
        <div style="display: flex; align-items: center; gap: 6px; padding: 6px 11px; background: #fee4e0; border-radius: 9999px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8d352e" stroke-width="2.4" stroke-linecap="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/></svg>

        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 6px 11px; background: #e3edfb; border-radius: 9999px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#355a92" stroke-width="2.4" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.3 8.3 0 0 1 3.6 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
          <span style="font-size: 14px; font-weight: 600; color: #355a92;">2 novas</span>
        </div>
      </div>
    </div>

    <div style="padding: 16px; background: #ffffff; border: 1px solid #e9e8e3; border-radius: 14px; display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 19px; font-weight: 600; line-height: 24px; letter-spacing: -0.2px;">Rede rural Linha Cascata</div>
          <div style="font-size: 14px; color: #767469;">Coop. Agrocampo &middot; Xanxer&ecirc;</div>
        </div>
        <div style="padding: 6px 11px; background: #f5f4f1; border-radius: 9999px; font-size: 14px; font-weight: 600; color: #504f48; white-space: nowrap;">A iniciar</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 14px; color: #767469;">0 de 18 postes</span>
          <span style="font-size: 14px; font-weight: 700; color: #aaa9a2; font-variant-numeric: tabular-nums;">0%</span>
        </div>
        <div style="height: 8px; border-radius: 9999px; background: #e9e8e3;"></div>
      </div>
    </div>
  </div>
</div>

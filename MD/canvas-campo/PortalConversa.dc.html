<!doctype html>
<html>
<head>

<body>
<x-dc>

<div style="width: 1440px; height: 900px; background: #fafaf8; color: #262623; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="padding: 20px 28px 0; background: #ffffff; border-bottom: 1px solid #e9e8e3; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">

    </div>

      <div style="padding: 10px 16px; border-bottom: 2px solid transparent; font-size: 14px; color: #67665f;">Obra</div>
      <div style="padding: 10px 16px; border-bottom: 2px solid transparent; font-size: 14px; color: #67665f;">Dia a dia</div>
      <div style="padding: 10px 16px; border-bottom: 2px solid #4472b4; font-size: 14px; font-weight: 600; color: #4472b4;">Conversa</div>

  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; overflow: hidden;">

        <div style="align-self: flex-end; max-width: 520px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">
          <div style="background: #4472b4; border-radius: 12px 12px 3px 12px; padding: 12px 16px; font-size: 14px; line-height: 21px; color: #ffffff;">Bom dia. Consegue subir a cruzeta do P2 ainda hoje?</div>
          <span style="font-size: 12px; color: #aaa9a2;">07:58 &middot; lido</span>
        </div>

        <div style="align-self: flex-end; width: 380px; display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">

            <div style="width: 36px; height: 36px; border-radius: 9999px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <svg viewBox="0 0 240 24" style="flex-grow: 1; height: 24px;">

              </g>

            <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums;">0:22</span>
          </div>
          <span style="font-size: 12px; color: #aaa9a2;">08:02 &middot; ouvido no campo</span>
        </div>

        <div style="align-self: flex-start; max-width: 520px; display: flex; gap: 11px;">
          <div style="width: 34px; height: 34px; border-radius: 9999px; background: #e3edfb; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #355a92; flex-shrink: 0;">JC</div>
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="background: #ffffff; border: 1px solid #e9e8e3; border-radius: 12px 12px 12px 3px; padding: 12px 16px; font-size: 14px; line-height: 21px;">Subi agora. Mandei foto no registro.</div>
            <span style="font-size: 12px; color: #aaa9a2;">11:06</span>
          </div>
        </div>

        <div style="align-self: flex-start; display: flex; gap: 11px; padding-left: 45px;">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="width: 260px; height: 190px; border-radius: 12px; background: #c3c2b8; overflow: hidden;">
              <svg viewBox="0 0 260 190" style="width: 100%; height: 100%;">
                <rect width="260" height="190" fill="#c3c2b8"/>
                <rect x="0" y="132" width="260" height="58" fill="#b3b2a7"/>
                <rect x="120" y="26" width="13" height="110" fill="#9b9a90"/>
                <rect x="88" y="34" width="78" height="8" fill="#9b9a90"/>
              </svg>
            </div>
            <span style="font-size: 12px; color: #aaa9a2;">11:07</span>
          </div>
        </div>

        <!-- contexto: a conversa sabe o que aconteceu na obra -->
        <div style="align-self: center; display: flex; align-items: center; gap: 10px; padding: 9px 15px; background: #f2f6fd; border: 1px solid #c9dcf8; border-radius: 9999px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4472b4" stroke-width="2.2" stroke-linecap="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <span style="font-size: 13px; color: #253b5c;">3 estruturas montadas no P2 &middot; 11:05</span>
          <a href="#" style="font-size: 13px; font-weight: 600;">ver no dia</a>
        </div>
      </div>

      <div style="padding: 16px 30px 24px; border-top: 1px solid #e9e8e3; background: #ffffff; display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f4f1; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#504f48" stroke-width="2" stroke-linecap="round"><path d="M21.4 11.1L12.3 20a5.5 5.5 0 0 1-7.8-7.8l9.2-9.1a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.1a1.8 1.8 0 0 1-2.6-2.6l8.5-8.4"/></svg>

        <div style="flex-grow: 1; height: 40px; border: 1px solid #d6d5ce; border-radius: 8px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: #aaa9a2;">Escreva para o Jos&eacute; Carlos</div>
        <div style="padding: 0 18px; height: 40px; background: #4472b4; border-radius: 8px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #ffffff;">Enviar</div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4472b4; text-decoration: none; }
    a:hover { color: #355a92; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fafaf8; color: #262623; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #ffffff; border-bottom: 1px solid #e9e8e3;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#504f48" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px;">Poste levantado</div>
      <div style="font-size: 14px; color: #767469;">P7 &middot; conforme o projeto</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 16px;">

    <!-- Foto: o primeiro campo, porque e o que prova -->
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.9px; color: #767469;">FOTO &middot; OBRIGAT&Oacute;RIA</div>
      <div style="display: flex; gap: 10px;">
        <div style="width: 108px; height: 108px; border-radius: 12px; background: #e9e8e3; position: relative; overflow: hidden;">
          <svg viewBox="0 0 108 108" style="width: 100%; height: 100%;">
            <rect width="108" height="108" fill="#d6d5ce"/>
            <rect x="0" y="74" width="108" height="34" fill="#c3c2b8"/>
            <rect x="48" y="18" width="9" height="62" fill="#aaa9a2"/>
            <rect x="34" y="22" width="38" height="5" fill="#aaa9a2"/>
          </svg>
          <div style="position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 9999px; background: rgba(38,38,35,0.7); display: flex; align-items: center; justify-content: center;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </div>
        </div>
        <div style="width: 108px; height: 108px; border-radius: 12px; border: 1.5px dashed #d6d5ce; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #ffffff;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4472b4" stroke-width="1.9" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span style="font-size: 14px; font-weight: 600; color: #4472b4;">C&acirc;mera</span>
        </div>
      </div>
    </div>

    <!-- Numeracao -->
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.9px; color: #767469;">NUMERA&Ccedil;&Atilde;O</div>
      <div style="height: 52px; border: 1px solid #d6d5ce; border-radius: 12px; background: #ffffff; display: flex; align-items: center; padding: 0 15px;">
        <span style="font-size: 17px; font-weight: 600; color: #262623;">P7</span>
        <span style="font-size: 14px; color: #aaa9a2; margin-left: 10px;">do projeto, s&oacute; leitura</span>
      </div>
    </div>

    <!-- Tipo -->
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.9px; color: #767469;">TIPO &middot; O PROJETO DIZ DT 9/300</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="padding: 11px 16px; border-radius: 9999px; background: #4472b4; font-size: 15px; font-weight: 600; color: #ffffff;">DT 9/300</div>
        <div style="padding: 11px 16px; border-radius: 9999px; background: #ffffff; border: 1px solid #d6d5ce; font-size: 15px; color: #504f48;">DT 11/400</div>
        <div style="padding: 11px 16px; border-radius: 9999px; background: #ffffff; border: 1px solid #d6d5ce; font-size: 15px; color: #504f48;">Circular</div>
      </div>
    </div>

    <!-- Observacao -->
    <div style="display: flex; flex-direction: column; gap: 9px; flex-grow: 1;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.9px; color: #767469;">OBSERVA&Ccedil;&Atilde;O</div>
      <div style="flex-grow: 1; min-height: 74px; border: 1px solid #d6d5ce; border-radius: 12px; background: #ffffff; padding: 13px 15px; font-size: 15px; color: #aaa9a2;">Opcional</div>
    </div>
  </div>

  <!-- Rodape: estado da rede como informacao, nao como erro -->
  <div style="background: #ffffff; border-top: 1px solid #e9e8e3; padding: 13px 16px 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#767469" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 3.1-2.1"/></svg>
      <span style="font-size: 14px; color: #767469;">Sem sinal. Vai para a fila e sobe sozinho.</span>
    </div>
    <div style="height: 56px; border-radius: 12px; background: #4472b4; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 700; color: #ffffff;">Salvar poste</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
